# Render Static Site Blueprint for MYRAA AI Website
# Deploy alongside the existing `myraa-super-brain-backend` Web Service in /render.yaml
services:
  - type: web
    name: myraa-ai-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_MYRAA_BACKEND_URL
        value: https://myraa-super-brain-backend.onrender.com
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: gen-lang-client-0645829429.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: gen-lang-client-0645829429
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: gen-lang-client-0645829429.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "514839656668"
      - key: VITE_FIREBASE_DATABASE_ID
        value: ai-studio-android-myraaai-e14a6757-ff2e-4f5e-b497-fef3a378e9b6
      - key: VITE_RECAPTCHA_ENTERPRISE_SITE_KEY
        value: 6LfIxhouAAAAAMQICWv6vV65q5IRonntyE0V1BFs
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_ANDROID_APK_URL
        sync: false
